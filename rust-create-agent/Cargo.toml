[package]
name = "rust-create-agent"
version = "0.1.0"
edition = "2021"
description = "Rust Agent framework with middleware system, aligned with @langgraph-js/standard-agent"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio-test = "0.4"
