<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Zen Code</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0d0d0d;
        color: #ccc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        gap: 24px;
      }

      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
        width: 380px;
      }

      /* Logo / title */
      .app-title {
        font-size: 18px;
        font-weight: 600;
        color: #e2e2e2;
        letter-spacing: 0.02em;
      }
      .app-subtitle {
        font-size: 12px;
        color: #444;
        margin-top: -8px;
      }

      /* Spinner */
      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid #2a2a2a;
        border-top-color: #7c6af7;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Status row */
      #status-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #status-text {
        color: #999;
        font-size: 13px;
      }
      #status-text.error { color: #f87171; }
      #status-text.success { color: #4ade80; }

      /* Progress bar */
      #progress-wrap {
        display: none;
        flex-direction: column;
        gap: 5px;
        width: 100%;
      }
      #progress-bar-bg {
        width: 100%;
        height: 3px;
        background: #1e1e1e;
        border-radius: 2px;
        overflow: hidden;
      }
      #progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7c6af7, #a78bfa);
        border-radius: 2px;
        transition: width 0.25s ease;
      }
      #progress-label {
        font-size: 11px;
        color: #555;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* Retry button */
      #retry-btn {
        display: none;
        padding: 7px 20px;
        background: #7c6af7;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
      }
      #retry-btn:hover { background: #6554e0; }

      /* Log area */
      #log-area {
        width: 380px;
        max-height: 160px;
        overflow-y: auto;
        background: #111;
        border: 1px solid #1e1e1e;
        border-radius: 6px;
        padding: 8px 10px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 11px;
        line-height: 1.7;
        color: #555;
        scroll-behavior: smooth;
      }
      #log-area .log-line { display: block; }
      #log-area .log-line.info  { color: #555; }
      #log-area .log-line.ok    { color: #4ade80; }
      #log-area .log-line.warn  { color: #facc15; }
      #log-area .log-line.error { color: #f87171; }
      #log-area .log-line.dim   { color: #333; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="app-title">Zen Code</div>
      <div class="app-subtitle">正在启动运行时...</div>

      <div id="status-row">
        <div class="spinner" id="spinner"></div>
        <p id="status-text">初始化中...</p>
      </div>

      <div id="progress-wrap">
        <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
        <span id="progress-label">0%</span>
      </div>

      <button id="retry-btn" onclick="window._retryInit && window._retryInit()">重试</button>
    </div>

    <div id="log-area"></div>

    <script src="/js/neutralino.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
