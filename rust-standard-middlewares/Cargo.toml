[package]
name = "rust-standard-middlewares"
version = "0.1.0"
edition = "2021"

[dependencies]
rust-create-agent = { path = "../rust-create-agent" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
gray_matter = "0.2"
dirs-next = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
