version: '3.9'

services:
    # TimescaleDB (PostgreSQL superset)
    db:
        image: timescale/timescaledb:latest-pg16
        container_name: skillpkg-db
        environment:
            POSTGRES_USER: skillpkg
            POSTGRES_PASSWORD: skillpkg_secret
            POSTGRES_DB: skillpkg
        ports:
            - '5433:5432'
        volumes:
            - skillpkg_db_data:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U skillpkg -d skillpkg']
            interval: 5s
            timeout: 5s
            retries: 10

    # MinIO (S3-compatible object storage)
    minio:
        image: minio/minio:latest
        container_name: skillpkg-minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: skillpkg_minio
            MINIO_ROOT_PASSWORD: skillpkg_minio_secret
        ports:
            - '9000:9000'
            - '9001:9001'
        volumes:
            - skillpkg_minio_data:/data
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 10

    # MinIO bucket init
    minio-init:
        image: minio/mc:latest
        container_name: skillpkg-minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 skillpkg_minio skillpkg_minio_secret &&
            mc mb --ignore-existing local/skillpkg-skills &&
            mc anonymous set download local/skillpkg-skills &&
            echo 'MinIO bucket initialized'
            "
        restart: 'no'

    # SkillPkg Registry Server
    registry:
        build:
            context: ..
            dockerfile: docker/Dockerfile.registry
        container_name: skillpkg-registry
        environment:
            DATABASE_URL: postgresql://skillpkg:skillpkg_secret@db:5432/skillpkg
            S3_ENDPOINT: http://minio:9000
            S3_BUCKET: skillpkg-skills
            S3_ACCESS_KEY: skillpkg_minio
            S3_SECRET_KEY: skillpkg_minio_secret
            S3_REGION: us-east-1
            S3_PUBLIC_URL: http://localhost:9000/skillpkg-skills
            JWT_SECRET: skillpkg_jwt_secret_change_in_production
            PORT: 3000
            NODE_ENV: production
        ports:
            - '3000:3000'
        depends_on:
            db:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    skillpkg_db_data:
    skillpkg_minio_data:
