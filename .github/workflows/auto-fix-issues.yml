name: Auto Fix Issues

on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  MODEL_PROVIDER: anthropic
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  ZEN_CODE_MODEL: ${{ secrets.ZEN_CODE_MODEL || 'glm-4.7' }}

jobs:
  auto-fix:
    if: |
      (github.event.label.name == 'auto-fix' || contains(github.event.issue.labels.*.name, 'auto-fix')) &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare context
        id: prepare
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZEN_CODE_MODEL: ${{ env.ZEN_CODE_MODEL }}
          MODEL_PROVIDER: ${{ env.MODEL_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
        run: |
          chmod +x .github/scripts/prepare_context.py
          python3 .github/scripts/prepare_context.py

      - name: Run zen-code
        id: zen_code
        run: |
          echo "=========================================="
          echo "Running zen-code"
          echo "=========================================="
          bunx --bun zen-code -p --yolo "${{ steps.prepare.outputs.prompt }}" 2>&1 | tee /tmp/zen_output.txt

          # Set output (limit to 64KB for GitHub Actions)
          echo "zen_output<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/zen_output.txt | head -c 60000 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check if PR should be created
          if [ -f /tmp/create-pr ]; then
            echo "should_create_pr=true" >> $GITHUB_OUTPUT
            echo "✓ PR creation requested"
          else
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No PR requested"
          fi

      - name: Process results and create PR
        env:
          ISSUE_NUMBER: ${{ steps.prepare.outputs.number }}
          ISSUE_TITLE: ${{ steps.prepare.outputs.title }}
          ISSUE_BODY: ${{ steps.prepare.outputs.body }}
          ZEN_OUTPUT: ${{ steps.zen_code.outputs.zen_output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/auto_fix_issue.py
          python3 .github/scripts/auto_fix_issue.py
