name: Build Rust Agent TUI

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build (${{ matrix.label }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: linux-x64
                      target: x86_64-unknown-linux-gnu
                      exe_suffix: ''
                    - os: macos-latest
                      label: macos-arm64
                      target: aarch64-apple-darwin
                      exe_suffix: ''
                    - os: macos-13
                      label: macos-x64
                      target: x86_64-apple-darwin
                      exe_suffix: ''
                    - os: windows-latest
                      label: windows-x64
                      target: x86_64-pc-windows-msvc
                      exe_suffix: '.exe'

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache cargo registry & build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ matrix.label }}-cargo-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      ${{ matrix.label }}-cargo-

            - name: Build workspace
              run: cargo build --release --target ${{ matrix.target }}

            - name: Upload binary
              uses: actions/upload-artifact@v4
              with:
                  name: agent-tui-${{ matrix.label }}
                  path: target/${{ matrix.target }}/release/agent-tui${{ matrix.exe_suffix }}
                  if-no-files-found: warn
