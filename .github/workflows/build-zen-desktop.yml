name: Build Zen Desktop

on:
    push:
        tags:
            - 'zen-desktop/v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version tag (e.g. zen-desktop/v1.0.0)'
                required: false
                default: 'dev'

permissions:
    contents: write

jobs:
    build:
        name: Build
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # 安装 Neutralinojs CLI
            - name: Install neu CLI
              run: bun add -g @neutralinojs/neu

            # 构建 Neutralinojs 应用资源包（resources.neu）
            # 不执行 neu update，使用仓库内已预置的 dist/neutralino/ 二进制
            - name: Build Neutralinojs app
              working-directory: zen-desktop
              run: neu update
            - name: Build Neutralinojs app
              working-directory: zen-desktop
              run: neu build --release

            - name: Rename macOS binaries to .app
              working-directory: zen-desktop/dist/neutralino
              run: |
                  for f in neutralino-mac_*; do
                    [ -f "$f" ] && mv "$f" "${f}.app"
                  done

            - name: Codesign macOS binaries (ad-hoc)
              working-directory: zen-desktop
              run: ./codesign-mac.sh "-"

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: zen-desktop
                  path: zen-desktop/dist/neutralino/
                  retention-days: 7
                  if-no-files-found: error
