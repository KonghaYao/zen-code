name: Build Zen Desktop

on:
    push:
        tags:
            - 'zen-desktop/v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version tag (e.g. zen-desktop/v1.0.0)'
                required: false
                default: 'dev'

permissions:
    contents: write

jobs:
    build:
        name: Build (${{ matrix.label }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      label: darwin-arm64
                      neu_platform: mac_arm64
                      artifact_name: zen-desktop-darwin-arm64

                    - os: macos-latest
                      label: linux-x64
                      neu_platform: linux_x64
                      artifact_name: zen-desktop-linux-x64

                    - os: macos-latest
                      label: win-x64
                      neu_platform: win_x64
                      artifact_name: zen-desktop-win-x64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # 安装 Neutralinojs CLI
            - name: Install neu CLI
              run: bun add -g @neutralinojs/neu

            # 构建 Neutralinojs 应用资源包（resources.neu）
            # 不执行 neu update，使用仓库内已预置的 dist/neutralino/ 二进制
            - name: Build Neutralinojs app
              working-directory: zen-desktop
              run: neu build --release

            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: |
                      zen-desktop/dist/neutralino/neutralino-${{ matrix.neu_platform }}${{ matrix.neu_platform == 'win_x64' && '.exe' || '' }}
                      zen-desktop/dist/neutralino/resources.neu
                  retention-days: 7
                  if-no-files-found: error
