[package]
name = "rust-agent-tui"
version = "0.1.0"
edition = "2021"
description = "TUI interface for Rust Agent - interactive terminal playground"

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[dependencies]
rust-agent-middlewares = { path = "../rust-agent-middlewares" }
ratatui = ">=0.30"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde_json = "1.0"
langchain-rust = "4.6.0"
futures-util = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
ratatui-textarea = "0.8"
tui-markdown = "0.3.7"
